spring:
  application:
    name: careconnect-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careconnect}
    username: ${SPRING_DATASOURCE_USERNAME:careconnect}
    password: ${SPRING_DATASOURCE_PASSWORD:careconnect}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

careconnect:
  seed:
    admin:
      # Used only by the local profile, and only when no ADMIN user exists yet. No default on purpose.
      password: ${SEED_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
