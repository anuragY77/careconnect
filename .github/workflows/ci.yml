name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs unit, ArchUnit and Testcontainers integration tests (Docker is available on the runner)
      - name: Build and test
        run: mvn -B clean verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Create throwaway environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=careconnect
          POSTGRES_USER=careconnect
          POSTGRES_PASSWORD=careconnect
          JWT_SECRET=ci-smoke-only-not-a-real-secret-0123456789abcdef
          EOF
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start all services, wait until healthy
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check that the application answers
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "<app-root>"
          docker compose ps
      - name: Show logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop and remove everything
        if: always()
        run: docker compose down --volumes
